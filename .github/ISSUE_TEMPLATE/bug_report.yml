name: Bug report
description: Something went wrong during a build
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result line
      description: >
        The JSON line the failing script printed, if you have it. For a task,
        `.freeloader/runs/<feature>/<task-id>/result.json` holds the same thing.
      render: json
  - type: textarea
    id: doctor
    attributes:
      label: Output of /freeloader:doctor
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Operating system, `opencode --version`, and `claude --version`.
    validations:
      required: true
